name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # typecheck + lint + tests with coverage thresholds. The crypto and db
      # layers carry their own high floors, which is what makes CLAUDE.md
      # invariant #6 ("no crypto change without tests") enforceable.
      - run: npm run verify

      - name: Expo config health
        run: npx expo-doctor

  audit:
    runs-on: ubuntu-latest
    # Deliberately not a gate. Every current advisory is one transitive
    # build-time dependency (uuid via xcode via @expo/config-plugins) that
    # never ships in the app bundle, and `npm audit fix --force` would
    # downgrade expo by eleven major versions. Report, do not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
